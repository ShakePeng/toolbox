name: Release

# 推 v* tag 触发：先建草稿 release，再逐平台构建并上传（含更新清单），最后发布。
# 版本号必须和 mygo.json 的 version 一致，否则直接失败，避免发错版本。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 建草稿 release 并上传产物

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 mygo.json 的版本号一致
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"

      # release 说明取自 CHANGELOG.md 中当前版本的小节，和更新弹窗里的说明一致。
      - name: 提取版本更新说明
        run: |
          python3 - <<'PY'
          import os
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          notes, on = [], False
          for line in open("CHANGELOG.md", encoding="utf-8"):
              if line.startswith("## "):
                  if on:
                      break
                  first = line[3:].strip().split()[0] if line[3:].strip() else ""
                  first = first.lstrip("[").split("]")[0]
                  on = first.lstrip("v") == version
                  continue
              if on:
                  notes.append(line)
          text = "".join(notes).strip()
          open("release-notes.md", "w", encoding="utf-8").write(text + ("\n" if text else ""))
          print(text or "(CHANGELOG.md 中没有该版本的小节，将使用 GitHub 自动生成的说明)")
          PY

      - name: 创建草稿 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # 上次失败留下的草稿：把说明补上
            if [ -s release-notes.md ]; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
            fi
          elif [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    name: macOS + Windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # mygo 在非 Windows 上不会自动下载 NSIS，需要本机有 makensis。
      # Windows 安装包由这里一起构建，避免再开一个 Windows runner。
      - name: 安装 NSIS（Windows 安装包）
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          if ! command -v makensis >/dev/null 2>&1; then
            brew install makensis
          fi
          makensis -VERSION

      # 用仓库里的固定自签名证书，而不是 ad-hoc。
      # ad-hoc 的 designated requirement 是 cdhash，每次构建都变，更新后会丢
      # 屏幕录制/辅助功能授权；固定证书的 DR 是 bundle id + 证书指纹，跨版本稳定。
      - name: 导入签名证书
        env:
          TOOLBOX_SIGNING_P12_PASSWORD: toolbox-local-dev
        run: |
          set -euo pipefail

          expected_sha1="1bda019447623096dbaf37354a7741f69151d8cb"
          actual_sha1="$(/usr/bin/openssl x509 -in signing/toolbox-signing.cer \
            -noout -fingerprint -sha1 | sed 's/.*=//;s/://g' | tr 'A-F' 'a-f')"
          [ "$actual_sha1" = "$expected_sha1" ] || {
            echo "仓库证书指纹不符：$actual_sha1" >&2
            exit 1
          }

          keychain="$RUNNER_TEMP/toolbox-signing.keychain-db"
          keychain_password="$(/usr/bin/openssl rand -hex 24)"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          security import signing/toolbox-signing.p12 -k "$keychain" -f pkcs12 \
            -P "$TOOLBOX_SIGNING_P12_PASSWORD" -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"

          # 自签名证书未信任时 security find-identity 可能返回 0 个有效身份。
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain signing/toolbox-signing.cer

          security list-keychains -d user -s "$keychain" \
            "$HOME/Library/Keychains/login.keychain-db"

          security find-identity -v -p codesigning "$keychain"
          security find-identity -v -p codesigning "$keychain" |
            grep -Fq '"Toolbox Local Dev"'

      - name: 构建并上传（app + dmg + 签名更新包）
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          identity="Toolbox Local Dev"
          expected_leaf='certificate leaf = H"1bda019447623096dbaf37354a7741f69151d8cb"'

          # macOS 只发布 Apple Silicon（arm64）；Windows 同时产出安装包。
          go tool mygo build \
            -platform "darwin/arm64,windows/amd64" \
            -sign "$identity" \
            -upload

          # 校验产物真的是固定证书签名，而不是回落到 ad-hoc（cdhash）。
          for app in build/darwin-*/toolbox.app; do
            dr="$(codesign -d -r- "$app" 2>&1)"
            echo "$app"
            echo "$dr"
            echo "$dr" | grep -Fq 'identifier "com.example.toolbox"'
            echo "$dr" | grep -Fq "$expected_leaf"
            if echo "$dr" | grep -q 'cdhash'; then
              echo "$app 仍是 ad-hoc 签名（DR 为 cdhash）" >&2
              exit 1
            fi
            codesign --verify --deep --strict "$app"
            codesign -dvvv "$app" 2>&1 | grep -Fq "Authority=$identity"
          done

          for dmg in build/darwin-*/*.dmg; do
            codesign --verify "$dmg"
            codesign -dvv "$dmg" 2>&1 | grep -Fq "Authority=$identity"
          done

          # Windows 产物的路径和命名由 mygo 固定：可执行文件 + NSIS 安装包。
          version="$(jq -r .version mygo.json)"
          test -f build/windows-amd64/toolbox.exe
          test -f "build/windows-amd64/toolbox-setup-${version}-amd64.exe"

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 发布草稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
